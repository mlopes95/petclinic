schema: spec-driven

# proposal.md is read by business people in review meetings. Technical detail belongs in
# design.md, so a reader who has never seen JSON can review the proposal end to end.
rules:
  proposal:
    - "Open with a `## Today` section holding one screenshot of the screen the change touches, taken from the running app (Playwright MCP or the browser tools) and saved next to proposal.md as `<screen>-before.png`, with an alt text saying what the reader should notice. It is the visual anchor of the review meeting. If the app is not running and cannot be started, reuse the matching screenshot from `user-manual/` and say so in the alt text; if the change has no screen, write one sentence saying which non-visual surface it touches instead."
    - "Write for a business reader: no code identifiers, class/DTO/file names, HTTP verbs or status codes, query parameters, JSON field names, SQL, index or migration names, library or framework names."
    - "Describe changes as what users and the business observe. Anything about how it is built goes to design.md; end the proposal with one line pointing there."
    - "Keep the Capabilities and Impact sections in plain language too: name screens, roles and consumers, not modules or endpoints."
  specs:
    - "End the spec with a Gherkin sketch in a ```gherkin block: Scenario Outlines with small Examples tables, reusing the steps already bound in petclinic-test/src/*.glue.ts (mark each step existing/new). Use the seeded data and keep it read-only on the DB."

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
